# the hashed build assets below are cached for good, but not a 404: during a rollout, a page from a new
# pod can ask an old one for a new chunk, and the CDN would then keep serving that 404 for a while
map $status $build_asset_cache_control {
    ~^[23]  'public, max-age=31536000, immutable';
    default 'no-store';
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # the SPA fallback is an internal redirect (last parameter), so that it gets the headers below
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "/" and the SPA fallback above end up here: always revalidate, so that a release reaches the
    # browsers at once, and the page references the build assets that exist. The Link header points
    # agents to the API catalog and llms.txt, as the <link>s in the page's head do
    location = /index.html {
        add_header 'Cache-Control' 'no-cache';
        add_header 'Link' '</.well-known/api-catalog>; rel="api-catalog", </llms.txt>; rel="describedby"; type="text/plain"';
    }

    # build output with a content hash in its file name: a URL never changes content. a missing file
    # must not fall back to index.html, which would then be cached as that asset
    location ~ ^/(js|css|fonts|img)/ {
        add_header 'Cache-Control' $build_asset_cache_control always;
        try_files $uri =404;
    }

    # Machine-readable paths (sitemaps, llms.txt, OpenAPI documents and the like) must answer 404 when the
    # file is not in the build. Falling back to the SPA's index.html would serve them as a 200 text/html page.
    # Regex locations take precedence over the prefix "location /", but not over the "=" and "^~" locations
    # below. None of these locations has add_header, so files that exist keep the same response headers.
    location ~* \.(xml|txt|json|md|ya?ml)$ {
        try_files $uri =404;
    }

    location ~ ^/(openapi|apis)(\.|/|$) {
        try_files $uri =404;
    }

    # the guide for coding agents and LLMs (meta#17) and robots.txt: UTF-8 text, and an edge cache short enough
    # that a change shows within the hour (Cloudflare caches .txt files)
    location = /llms.txt {
        charset utf-8;
        add_header 'Cache-Control' 'public, max-age=3600';
    }

    location = /robots.txt {
        charset utf-8;
        add_header 'Cache-Control' 'public, max-age=3600';
    }

    # the MCP server (meta#20) is on its own host, and someone guessing penguin-stats.io/mcp must not get the app (a
    # 200 HTML page). A GET or HEAD, from a browser or an agent, goes to the setup guide. An MCP client set up with
    # this URL sends POSTs, and a GET with Accept: text/event-stream to open a stream; both go to the server with a
    # 308, which keeps the method and the body. The server ends that GET with a 405, while the guide's 200 would read
    # as a stream that the client reopens every second. No cache keeps any answer, so that the guide or the server
    # can move. "return" is safe in an "if"
    location = /mcp {
        add_header 'Cache-Control' 'no-store' always;
        if ($request_method !~ ^(GET|HEAD)$) {
            return 308 https://mcp.penguin-stats.io/mcp;
        }
        if ($http_accept ~* text/event-stream) {
            return 308 https://mcp.penguin-stats.io/mcp;
        }
        return 302 https://mcp.penguin-stats.io/;
    }

    location ^~ /favicon/ {
        add_header 'Cache-Control' 'max-age=604800, public, must-revalidate';
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location = /service-worker.js {
        add_header 'Cache-Control' 'public, max-age=720, must-revalidate';
    }

    # "^~" keeps the regex locations above from taking files such as /.well-known/security.txt away from here.
    location ^~ /.well-known {
        add_header 'Cache-Control' 'no-cache';
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header 'Cache-Control' 'no-cache';
    }

    # the RFC 9727 API catalog (meta#8): the file has no extension, so default_type gives its media type; RFC 9727
    # asks for the Link header on a HEAD request too
    location = /.well-known/api-catalog {
        default_type 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"';
        add_header 'Link' '</.well-known/api-catalog>; rel="api-catalog"';
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Cache-Control' 'public, max-age=3600';
    }

    # the proof that we hold penguin-stats.io for the official MCP Registry (namespace io.penguin-stats): the public
    # key whose private half signs our publications. The registry follows no redirect and reads the body whatever its
    # type; the file has no extension, so default_type gives it one. no-cache, so that a new key is seen at once
    location = /.well-known/mcp-registry-auth {
        default_type 'text/plain; charset=utf-8';
        add_header 'Cache-Control' 'no-cache';
    }

    location /compliance {
        add_header 'Cache-Control' 'no-cache';
    }


}