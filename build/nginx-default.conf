# the hashed build assets below are cached for good, but not a 404: during a rollout, a page from a new
# pod can ask an old one for a new chunk, and the CDN would then keep serving that 404 for a while
map $status $build_asset_cache_control {
    ~^[23]  'public, max-age=31536000, immutable';
    default 'no-store';
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # the SPA fallback is an internal redirect (last parameter), so that it gets the headers below
    location / {
        try_files $uri $uri/ /index.html;
    }

    # "/" and the SPA fallback above end up here: always revalidate, so that a release reaches the
    # browsers at once, and the page references the build assets that exist
    location = /index.html {
        add_header 'Cache-Control' 'no-cache';
    }

    # build output with a content hash in its file name: a URL never changes content. a missing file
    # must not fall back to index.html, which would then be cached as that asset
    location ~ ^/(js|css|fonts|img)/ {
        add_header 'Cache-Control' $build_asset_cache_control always;
        try_files $uri =404;
    }

    # Machine-readable paths (sitemaps, llms.txt, OpenAPI documents and the like) must answer 404 when the
    # file is not in the build. Falling back to the SPA's index.html would serve them as a 200 text/html page.
    # Regex locations take precedence over the prefix "location /", but not over the "=" and "^~" locations
    # below. None of these locations has add_header, so files that exist keep the same response headers.
    location ~* \.(xml|txt|json|md|ya?ml)$ {
        try_files $uri =404;
    }

    location ~ ^/(openapi|apis)(\.|/|$) {
        try_files $uri =404;
    }

    location ^~ /favicon/ {
        add_header 'Cache-Control' 'max-age=604800, public, must-revalidate';
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location = /service-worker.js {
        add_header 'Cache-Control' 'public, max-age=720, must-revalidate';
    }

    # "^~" keeps the regex locations above from taking files such as /.well-known/security.txt away from here.
    location ^~ /.well-known {
        add_header 'Cache-Control' 'no-cache';
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header 'Cache-Control' 'no-cache';
    }

    location /compliance {
        add_header 'Cache-Control' 'no-cache';
    }


}