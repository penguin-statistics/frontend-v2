name: Build Docker Image (Check)

on:
  # trigger on any pull requests
  pull_request:
    branches:
      - "master"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Test release recovery without network writes"
        run: |
          node .github/tests/release.test.cjs
          node .github/tests/release-image.test.cjs
          node .github/tests/pages-build.test.cjs

      - name: "Test the files for crawlers and agents"
        run: node .github/tests/discovery.test.cjs

      - name: "Check the links of the files for crawlers and agents and the expiry of security.txt (not blocking)"
        continue-on-error: true
        run: node .github/tests/discovery.test.cjs --online

      - name: "Docker: Build and Push Image"
        id: ghcr-docker
        uses: 'penguin-statistics/actions/ghcr-docker@e92ec679ecea64f9160208aa857caf8e0b70e56a'
        with:
          version: '__check__'
          repository: 'penguin-statistics/frontend-v2'
          push: false
