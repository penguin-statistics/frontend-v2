name: Build Docker Image (Release)

on:
  push:
    # trigger on version tag push
    tags:
      - "v*"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Check release version before side effects"
        run: node .github/scripts/check-version.cjs

      - name: "Test release recovery without network writes"
        run: node .github/tests/release.test.cjs

      - name: "Metadata: Git"
        id: git-meta
        uses: 'penguin-statistics/actions/git-meta@e92ec679ecea64f9160208aa857caf8e0b70e56a'

      - name: "Docker: Build and Push Image"
        id: ghcr-docker
        uses: 'penguin-statistics/actions/ghcr-docker@e92ec679ecea64f9160208aa857caf8e0b70e56a'
        with:
          version: ${{ steps.git-meta.outputs.version }}
          repository: 'penguin-statistics/frontend-v2'
          build-args: TRUNCATED_GITHUB_SHA=${{ steps.git-meta.outputs.mini-sha }}

      # Local steps avoid changing shared @main consumers in other repositories.
      - name: "Sentry: Create Release"
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: prod
          version: ${{ steps.git-meta.outputs.version }}
          ignore_empty: true

      - name: "GitHub: Ensure Repository Release"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
        with:
          script: |
            const { ensureRelease } = require('./.github/scripts/release.cjs');
            await ensureRelease(github, context, process.env.RELEASE_TAG);

      - name: "Manifest: Ensure Frontend Version"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
        with:
          github-token: ${{ secrets.PAT_FOR_MANIFESTBOT }}
          script: |
            const { ensureManifest } = require('./.github/scripts/release.cjs');
            const result = await ensureManifest(github, process.env.RELEASE_TAG, context.sha);
            core.info(result.changed ? 'Frontend manifest version updated' : 'Frontend manifest already matches; no write needed');
