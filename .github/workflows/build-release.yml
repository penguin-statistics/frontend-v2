name: Build Docker Image (Release)

on:
  push:
    # trigger on version tag push
    tags:
      - "v*"

concurrency:
  group: frontend-production-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.git-meta.outputs.version }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Check release version before side effects"
        run: node .github/scripts/check-version.cjs

      - name: "Test release recovery without network writes"
        run: |
          node .github/tests/release.test.cjs
          node .github/tests/release-image.test.cjs
          node .github/tests/pages-build.test.cjs

      - name: "Metadata: Git"
        id: git-meta
        uses: 'penguin-statistics/actions/git-meta@e92ec679ecea64f9160208aa857caf8e0b70e56a'

      # Read-only checks precede image, Sentry and GitHub Release writes.
      - name: "Manifest: Check Promotion"
        id: promotion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
        with:
          github-token: ${{ secrets.PAT_FOR_MANIFESTBOT }}
          script: |
            const { ensureManifest } = require('./.github/scripts/release.cjs');
            const plan = await ensureManifest(github, process.env.RELEASE_TAG, context.sha, { checkOnly: true });
            core.setOutput('changed', String(plan.changed));

      - name: "Docker: Reuse Existing Version"
        id: image
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
          REGISTRY_TOKEN: ${{ github.token }}
          MANIFEST_CHANGES: ${{ steps.promotion.outputs.changed }}
        with:
          script: |
            const { planImage } = require('./.github/scripts/release-image.cjs');
            const plan = await planImage(github, { repo: context.repo, actor: context.actor, token: process.env.REGISTRY_TOKEN }, process.env.RELEASE_TAG, process.env.MANIFEST_CHANGES === 'true');
            core.setOutput('build', String(plan.build));
            core.info(plan.build ? 'New version image required' : 'Existing version image retained');

      - name: "Docker: Setup Buildx"
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: "Docker: Login"
        if: steps.image.outputs.build == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: "Docker: Publish New Version Only"
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          push: true
          tags: ghcr.io/penguin-statistics/frontend-v2:${{ steps.git-meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/penguin-statistics/frontend-v2
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.git-meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.git-meta.outputs.version }}
            TRUNCATED_GITHUB_SHA=${{ steps.git-meta.outputs.mini-sha }}
            VUE_APP_DATADOG_RUM_APPLICATION_ID=${{ vars.DATADOG_RUM_APPLICATION_ID }}
            VUE_APP_DATADOG_RUM_CLIENT_TOKEN=${{ vars.DATADOG_RUM_CLIENT_TOKEN }}
            VUE_APP_DATADOG_RUM_SESSION_SAMPLE_RATE=${{ vars.DATADOG_RUM_SESSION_SAMPLE_RATE }}

      # Local steps avoid changing shared @main consumers in other repositories.
      - name: "Sentry: Create Release"
        uses: getsentry/action-release@a74facf8a080ecbdf1cb355f16743530d712abb7 # v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: prod
          version: ${{ steps.git-meta.outputs.version }}
          ignore_empty: true

      - name: "GitHub: Ensure Repository Release"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
        with:
          script: |
            const { ensureRelease } = require('./.github/scripts/release.cjs');
            await ensureRelease(github, context, process.env.RELEASE_TAG);

      - name: "Manifest: Ensure Frontend Version"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RELEASE_TAG: ${{ steps.git-meta.outputs.version }}
        with:
          github-token: ${{ secrets.PAT_FOR_MANIFESTBOT }}
          script: |
            const { ensureManifest } = require('./.github/scripts/release.cjs');
            const result = await ensureManifest(github, process.env.RELEASE_TAG, context.sha);
            core.info(result.changed ? 'Frontend manifest version updated' : 'Frontend manifest already matches; no write needed');

  # Datadog RUM shows the stack traces of the frontend errors in the original source once it has the source maps
  # of the version (the one the build embeds: v + package.json version) under the URL path they are served at.
  # They come from the image of this version, new or reused, so that they match the deployed bundles.
  # datadog-ci is fetched at run time, so it runs in its own job: a read-only token that checkout does not keep,
  # no install scripts, and nothing it could tamper with (the image, release and manifest are written before).
  # Without the DATADOG_API_KEY secret the job does nothing, and a failed upload never fails the release.
  sourcemaps:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: "Datadog: Upload Source Maps"
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_SITE: datadoghq.com
          IMAGE: ghcr.io/penguin-statistics/frontend-v2:${{ needs.build.outputs.version }}
          REGISTRY_TOKEN: ${{ github.token }}
          npm_config_ignore_scripts: "true"
        run: |
          if [ -z "$DATADOG_API_KEY" ]; then
            echo "::notice::DATADOG_API_KEY is not set: source maps not uploaded"
            exit 0
          fi
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          container=$(docker create "$IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/nginx/html/js" "$RUNNER_TEMP/sourcemaps"
          npx --yes @datadog/datadog-ci@5.24.1 sourcemaps upload "$RUNNER_TEMP/sourcemaps" \
            --service penguin-stats-frontend \
            --release-version "v$(node -p "require('./package.json').version")" \
            --minified-path-prefix /js \
            --project-path "webpack:///./"
